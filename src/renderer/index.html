<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
    <title>USB-RS485 Command Tool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>USB-RS485</h1>
        <p>Hardware scan and system setup</p>
      </div>
      <img class="header-logo" src="assets/renishaw-logo.png" alt="Renishaw" />
    </header>

    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="card-heading">
          <div>
            <h2 id="page-title">inVia Pre-System Test</h2>
            <div id="status" role="status">Enter the serial number and operator to scan hardware.</div>
          </div>
          <div class="actions">
            <button class="button secondary" type="button" data-csv="Addresses.csv">Addresses.csv</button>
            <button class="button primary" type="button" data-csv="operator.csv">operator.csv</button>
            <button class="button save" id="save-csv" type="button" hidden>Save changes</button>
          </div>
        </div>

        <div class="divider"></div>
        <section class="scan-setup" aria-label="Test setup">
          <label for="serial-number">Serial number</label>
          <input id="serial-number" name="serialNumber" type="text" maxlength="6" placeholder="6 characters" autocomplete="off">
          <label for="operator-select">Operator</label>
          <select id="operator-select" name="operator" disabled>
            <option value="">Loading operators…</option>
          </select>
          <button class="button scan" id="scan-hardware" type="button" disabled>Scan hardware</button>
        </section>
        <div id="setup-status" role="status" aria-live="polite"></div>
        <section id="scan-results" hidden aria-labelledby="scan-title">
          <h3 id="scan-title">Detected hardware</h3>
          <div id="scan-status" role="status" aria-live="polite"></div>
          <div class="scan-table-shell">
            <table id="scan-table">
              <thead>
                <tr>
                  <th>Address</th>
                  <th>Description</th>
                  <th>Firmware</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
        <h3 id="file-title">No file selected</h3>
        <div class="table-shell">
          <table id="csv-table" hidden>
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
